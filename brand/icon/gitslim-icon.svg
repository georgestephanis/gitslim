<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="gitslim icon — disk slice">
  <defs>
    
    <linearGradient id="beforeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bbe"></stop>
      <stop offset="1" stop-color="#a8137e"></stop>
    </linearGradient>
    
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="transparent"></rect>
      <rect width="3" height="6" fill="rgba(0,0,0,0.25)"></rect>
    </pattern>
    
    <linearGradient id="afterGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36f9f6"></stop>
      <stop offset="1" stop-color="#0fb8b5"></stop>
    </linearGradient>
    
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36f9f6" stop-opacity="0.9"></stop>
      <stop offset="1" stop-color="#36f9f6" stop-opacity="0"></stop>
    </linearGradient>
    
    <filter id="glowMag" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"></feGaussianBlur>
      <feFlood flood-color="#ff2bbe" flood-opacity="0.55"></feFlood>
      <feComposite in2="b" operator="in"></feComposite>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"></feGaussianBlur>
      <feFlood flood-color="#36f9f6" flood-opacity="0.75"></feFlood>
      <feComposite in2="b" operator="in"></feComposite>
      <feMerge><feMergeNode></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"></stop>
    </radialGradient>
    
    <pattern id="scan" patternUnits="userSpaceOnUse" width="3" height="3">
      <rect width="3" height="1" fill="rgba(255,255,255,0.04)"></rect>
    </pattern>
  </defs>

  
  <rect width="256" height="256" fill="#0d0220"></rect>

  
  <text x="28" y="68" font-family="&#39;JetBrains Mono&#39;,&#39;IBM Plex Mono&#39;,monospace" font-size="10" font-weight="500" fill="#ff2bbe" letter-spacing="2">BEFORE · 2.4G</text>

  
  <g filter="url(#glowMag)">
    <rect x="28" y="76" width="200" height="26" fill="url(#beforeGrad)" stroke="#ff5cd1" stroke-width="1"></rect>
    <rect x="28" y="76" width="200" height="26" fill="url(#hatch)"></rect>
  </g>

  
  <line x1="20" y1="128" x2="236" y2="128" stroke="#f0e6ff" stroke-width="2"></line>
  <line x1="20" y1="128" x2="236" y2="128" stroke="#36f9f6" stroke-width="1" opacity="0.6"></line>

  
  <g transform="translate(98 110)" filter="url(#glowCyan)">
    <polygon points="0,18 60,0 60,36" fill="#f0e6ff" stroke="#36f9f6" stroke-width="1"></polygon>
    <polygon points="0,18 60,0 60,36" fill="url(#bladeGrad)"></polygon>
  </g>

  
  <g filter="url(#glowCyan)">
    <rect x="28" y="160" width="44" height="10" fill="url(#afterGrad)" stroke="#7afffd" stroke-width="1"></rect>
  </g>

  
  <text x="28" y="186" font-family="&#39;JetBrains Mono&#39;,&#39;IBM Plex Mono&#39;,monospace" font-size="10" font-weight="500" fill="#36f9f6" letter-spacing="2">AFTER · 84M</text>

  
  <text x="128" y="222" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;,&#39;IBM Plex Mono&#39;,monospace" font-size="11" font-weight="700" fill="#a06fff" letter-spacing="4">gitslim</text>

  
  <rect width="256" height="256" fill="url(#scan)" style="mix-blend-mode:overlay"></rect>

  
  <rect width="256" height="256" fill="url(#vignette)"></rect>
</svg>